version: 2
models:
  - name: dim_users
    description: "One row per user."
    columns:
      - name: user_id
        description: "Primary key."
        data_tests:
          - unique
          - not_null
  - name: fct_order_items
    description: "One row per order item, with order status and timing."
    columns:
      - name: order_item_id
        data_tests:
          - unique
          - not_null
      - name: user_id
        description: "FK to dim_users."
        data_tests:
          - relationships:
              arguments:
                to: ref('dim_users')
                field: user_id